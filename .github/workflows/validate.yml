name: Public overview integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  disclosure-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public file allowlist and links
        run: python3 tools/validate_public_package.py
